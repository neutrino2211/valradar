[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valradar"
version = "0.1.0"
description = "Python SDK for writing Valradar OSINT/RECON plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mainasara Al-amin Tsowa", email = "neutrino2211@gmail.com" }
]
keywords = ["osint", "recon", "security", "plugin", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]

# No required dependencies - keep it minimal
dependencies = []

[project.optional-dependencies]
# Optional HTTP client support
http = ["requests>=2.28.0"]
# Development dependencies
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/neutrino2211/valradar"
Repository = "https://github.com/neutrino2211/valradar"
Documentation = "https://github.com/neutrino2211/valradar#readme"

[tool.hatch.build.targets.wheel]
packages = ["valradar"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
