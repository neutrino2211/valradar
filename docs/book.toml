[book]
title = "Valradar"
authors = ["Mainasara Tsowa"]
description = "High-performance OSINT/RECON data processing framework"
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/neutrino2211/valradar"
edit-url-template = "https://github.com/neutrino2211/valradar/edit/main/docs/{path}"
site-url = "/valradar/"
cname = ""

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-links = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
